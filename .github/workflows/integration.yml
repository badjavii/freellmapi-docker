name: Config and runtime tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs
      - run: docker compose config --quiet
