name: Vault tests

on:
  pull_request:
    paths:
      - "tools/vault/**"
      - "tests/vault.test.mjs"
      - ".github/workflows/vault.yml"
  push:
    branches: [main]
    paths:
      - "tools/vault/**"
      - "tests/vault.test.mjs"
      - ".github/workflows/vault.yml"

jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/vault.test.mjs
