name: Docker build and smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare dummy local runtime
        shell: bash
        run: |
          mkdir -p .runtime/data
          printf '%s\n' '{"admin":{"email":"smoke@example.com","password":"long-smoke-dashboard-password"},"keys":[],"routing":{"strategy":"balanced"}}' > .runtime/providers.json
          printf 'ENCRYPTION_KEY=%064d\n' 0 > .runtime/app.env
          printf '%s\n' "HOST_UID=$(id -u)" "HOST_GID=$(id -g)" "PORT=3001" > .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build FreeLLMAPI locally
        run: docker compose build freellmapi
      - name: Start and check health
        shell: bash
        run: |
          docker compose up -d --no-build freellmapi
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3001/api/ping; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs freellmapi
          exit 1
      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans
